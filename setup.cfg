[metadata]
description_file = README.md
name = CAVA
version = 2.0.15
description = "CAVA (Clinical Annotation of VAriants)"
url = "https://github.com/sicotteh/CAVA"
author = "Steven-N-Hart, Hugues-Sicotte"
author_email = "hart.steven@mayo.edu, sicotte.hugues@mayo.edu,hugues.sicotte@gmail.com"
license = "MIT"
project_urls =
    Homepage = https://github.com/sicotteh/CAVA
    Previous = https://github.com/Steven-N-Hart/CAVA
[options.package_data]
* = *.txt, *.config, *.bed, *.bgz, *.csv, *.tbi, *.fa, *.idx, *.tab, *.tsv, *.gz \
[options]
python_requires = >=3.9
zip_safe = False
include_package_data = True
packages =
    cava
    cava.utils
    cava.ensembldb
    cava.data
    cava.test

[bdist_wheel]
