name: Packaging Validation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  package-and-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install release tooling
        run: python -m pip install -e .[release]

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Install wheel and run smoke tests
        run: |
          python -m venv /tmp/cava-wheel-test
          source /tmp/cava-wheel-test/bin/activate
          python -m pip install --no-cache-dir dist/*.whl
          python -m pip check
          python -m cava.CAVA --help
          cava --help